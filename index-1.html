<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24211f">
<title>the.shomi</title>
<style>
:root{color-scheme:dark;--bg:#24211f;--steel:#8d8a86;--steel-hi:#d3d0cb;--steel-lo:#55524f;--brass:#c8a35b;--led:#ff9d2e;--ink:#f3eee6;--muted:#b0a9a0;--red:#e0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Manrope","Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding:14px 16px 16px;gap:14px;background:linear-gradient(90deg,#1a1817,var(--bg) 8%,var(--bg) 92%,#1a1817)}
.board{display:flex;align-items:center;justify-content:center;gap:16px;background:#120f0d;border:2px solid var(--brass);border-radius:10px;padding:8px 18px;box-shadow:inset 0 0 18px #000,0 2px 0 #000}
.arrow{font-size:22px;color:var(--led);opacity:.15;transition:opacity .2s;width:20px;text-align:center}
.arrow.on{opacity:1;text-shadow:0 0 10px var(--led)}
.num{font:700 44px/1 "Courier New",monospace;color:var(--led);text-shadow:0 0 14px var(--led);min-width:60px;text-align:center}
.shaft{position:relative;flex:1;min-height:0;border:6px solid var(--steel-lo);border-radius:6px;background:#000;overflow:hidden;box-shadow:0 0 0 2px #000,inset 0 0 30px #000}
.shaft.shake{animation:sh .22s linear infinite}
@keyframes sh{0%,100%{transform:translate(0,0)}25%{transform:translate(1px,-1px)}75%{transform:translate(-1px,1px)}}
.room{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:24px;background:radial-gradient(circle at 50% 38%,var(--c,#6b4a2b) 0,#150f0d 78%)}
.room .ico{font-size:76px;line-height:1;filter:drop-shadow(0 6px 14px #0008)}
.room h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.01em}
.room p{margin:0;color:var(--muted);font-size:15px;max-width:27ch;line-height:1.4}
.go{margin-top:6px;display:inline-block;padding:14px 28px;border-radius:999px;background:var(--ink);color:#1b1512;font-weight:800;font-size:16px;text-decoration:none;box-shadow:0 6px 0 #0006}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 #0006}
.r13 .ico,.r13 h1{animation:fl 3s infinite}
.r13 h1{color:#ff6a5a}
@keyframes fl{0%,88%,100%{opacity:1}89%{opacity:.25}91%{opacity:1}94%{opacity:.5}96%{opacity:1}}
.door{position:absolute;top:0;bottom:0;width:50.4%;z-index:2;
background:linear-gradient(90deg,#fff3,transparent 22%,transparent 78%,#0005),repeating-linear-gradient(90deg,#ffffff0a 0 1px,transparent 1px 3px),linear-gradient(180deg,var(--steel-hi),var(--steel) 32%,var(--steel-lo));
transition:transform 1s cubic-bezier(.6,0,.3,1);box-shadow:inset 0 0 0 3px #0003}
.door.l{left:0;border-right:2px solid #000;transform:translateX(-101%)}
.door.r{right:0;border-left:2px solid #000;transform:translateX(101%)}
.closed .door{transform:translateX(0)}
.door::after{content:"";position:absolute;inset:18px 14px;border:2px solid #0002;border-radius:3px}
.seam{position:absolute;left:calc(50% - 1.5px);top:0;bottom:0;width:3px;z-index:3;background:var(--led);box-shadow:0 0 14px 3px var(--led);opacity:0;transition:opacity .35s}
.seam.pass{opacity:.9;transition:none}
.toast{position:absolute;left:12px;right:12px;top:12px;z-index:5;padding:10px 14px;border-radius:10px;background:#120f0dee;border:1px solid var(--brass);font-size:14px;text-align:center;opacity:0;transform:translateY(-8px);transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.panel{display:flex;justify-content:space-between;gap:8px;padding:12px;border-radius:14px;background:linear-gradient(180deg,#3a3633,#2a2725);border:2px solid var(--steel-lo)}
.btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font:600 11px/1.1 inherit;font-family:inherit;cursor:pointer;padding:0}
.btn i{font-style:normal;width:100%;max-width:56px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font:800 20px "Courier New",monospace;color:var(--ink);background:radial-gradient(circle at 35% 30%,#6a6560,#2c2926);border:3px solid var(--steel);box-shadow:0 4px 0 #000a;transition:.15s}
.btn:active i{transform:translateY(3px);box-shadow:0 1px 0 #000a}
.btn.lit i{border-color:var(--led);color:var(--led);box-shadow:0 0 16px var(--led),inset 0 0 8px #ff9d2e66}
.btn.hot i{border-color:var(--red)}
.btn.hot.lit i{border-color:var(--red);color:#ff6a5a;box-shadow:0 0 16px var(--red),inset 0 0 8px #e0392b77}
.btn.bell i{font-size:22px;border-color:var(--brass)}
.btn:focus-visible i{outline:3px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.door{transition-duration:.01s}.shake{animation:none!important}.r13 .ico,.r13 h1{animation:none}}
</style>
</head>
<body>
<main class="app">
  <div class="board" aria-live="polite"><span class="arrow" id="up">▲</span><span class="num" id="num">1</span><span class="arrow" id="dn">▼</span></div>
  <section class="shaft closed" id="shaft">
    <div class="room" id="room"></div>
    <div class="door l"></div><div class="door r"></div><div class="seam" id="seam"></div>
    <div class="toast" id="toast"></div>
  </section>
  <nav class="panel" id="panel" aria-label="Этажи"></nav>
</main>
<script>
var FLOORS=[
 {n:1,label:"Лобби",ico:"🛗",color:"#6b4a2b",title:"the.shomi",text:"Добро пожаловать. Выбери этаж. Тринадцатый тоже есть.",url:""},
 {n:2,label:"Instagram",ico:"📸",color:"#a8316b",title:"Instagram",text:"Фото, истории и всё, что не влезло сюда.",url:"https://www.instagram.com/the.shomi/"},
 {n:3,label:"TikTok",ico:"🎵",color:"#1a8f8a",title:"TikTok",text:"Короткие видео без фильтров и сценария.",url:"https://www.tiktok.com/@the.shomi"},
 {n:13,label:"Telegram",ico:"✈️",color:"#7a1a14",title:"Этаж 13",text:"Этажа, которого нет в обычных лифтах. Здесь живёт мой Telegram.",url:"https://t.me/theshomi13",hot:1}
];
var shaft=document.getElementById("shaft"),room=document.getElementById("room"),panel=document.getElementById("panel"),num=document.getElementById("num"),up=document.getElementById("up"),dn=document.getElementById("dn"),seam=document.getElementById("seam"),toastEl=document.getElementById("toast");
var cur=0,busy=false,ac=null,tt;
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function toast(s){toastEl.textContent=s;toastEl.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){toastEl.classList.remove("on")},2800)}

/* ---- звук: всё синтезируется, без файлов ---- */
function A(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}catch(e){}return ac}
function env(g,t,a,pk,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function osc(type,f,t,a,pk,d,dest){var o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;env(g,t,a,pk,d);o.connect(g);g.connect(dest||ac.destination);o.start(t);o.stop(t+a+d+.05);return o}
function noise(d){var n=ac.sampleRate*d,b=ac.createBuffer(1,n,ac.sampleRate),x=b.getChannelData(0);for(var i=0;i<n;i++)x[i]=Math.random()*2-1;var s=ac.createBufferSource();s.buffer=b;return s}
function bell(t){[1,2.76,5.4].forEach(function(m,k){osc("sine",1175*m,t,.004,.32/(k*2+1),k?.5:2.2)})}
function thunk(t){var o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(42,t+.16);env(g,t,.005,.55,.22);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.3)}
function doorSnd(){var t=ac.currentTime,n=noise(1.2),f=ac.createBiquadFilter(),g=ac.createGain();f.type="bandpass";f.Q.value=.9;f.frequency.setValueAtTime(260,t);f.frequency.linearRampToValueAtTime(900,t+.9);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.2,t+.2);g.gain.linearRampToValueAtTime(.0001,t+1);n.connect(f);f.connect(g);g.connect(ac.destination);n.start(t);thunk(t+.92)}
function motor(dur){var t=ac.currentTime,f=ac.createBiquadFilter(),g=ac.createGain();f.type="lowpass";f.frequency.value=240;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.16,t+.7);g.gain.setValueAtTime(.16,t+dur-.6);g.gain.linearRampToValueAtTime(.0001,t+dur);f.connect(g);g.connect(ac.destination);
 [0,14].forEach(function(dt){var o=ac.createOscillator();o.type="sawtooth";o.detune.value=dt;o.frequency.setValueAtTime(38,t);o.frequency.linearRampToValueAtTime(64,t+.9);o.frequency.setValueAtTime(64,t+dur-.7);o.frequency.linearRampToValueAtTime(36,t+dur);o.connect(f);o.start(t);o.stop(t+dur+.1)})}
var CH=[[261.6,329.6,392,493.9],[220,261.6,329.6,392],[293.7,349.2,440,523.3],[196,246.9,293.7,349.2]];
function muzak(){var lp=ac.createBiquadFilter(),g=ac.createGain(),i=0;lp.type="lowpass";lp.frequency.value=1700;g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.linearRampToValueAtTime(1,ac.currentTime+.8);lp.connect(g);g.connect(ac.destination);
 var id=setInterval(function(){var c=CH[(i>>2)%4],t=ac.currentTime;osc("triangle",c[i%4],t,.01,.09,.9,lp);if(i%4===0)osc("sine",c[0]/2,t,.02,.12,1.1,lp);i++},300);
 return function(){clearInterval(id);g.gain.setValueAtTime(g.gain.value,ac.currentTime);g.gain.linearRampToValueAtTime(.0001,ac.currentTime+.5)}}
function tick(){osc("sine",170,ac.currentTime,.003,.1,.05)}
function alarm(){A();var t=ac.currentTime;for(var k=0;k<9;k++)osc("square",2100,t+k*.14,.004,.1,.08);buzz([80,60,80,60,80]);toast("Всё в порядке, лифт едет. Выбери этаж.")}

/* ---- лифт ---- */
function render(i){var f=FLOORS[i];room.className="room"+(f.n===13?" r13":"");room.style.setProperty("--c",f.color);
 room.innerHTML='<div class="ico">'+f.ico+'</div><h1></h1><p></p>'+(f.url?'<a class="go" target="_blank" rel="noopener">Выйти здесь</a>':"");
 room.querySelector("h1").textContent=f.title;room.querySelector("p").textContent=f.text;var a=room.querySelector(".go");if(a)a.href=f.url}
function light(i){[].forEach.call(panel.children,function(b,k){b.classList.toggle("lit",k===i)})}
async function go(i){
 if(busy||i===cur)return;busy=true;A();light(i);buzz(30);
 var from=FLOORS[cur].n,to=FLOORS[i].n,dir=to>from?1:-1,dist=Math.abs(to-from),step=Math.min(520,2800/dist);
 shaft.classList.add("closed");doorSnd();await wait(1200);
 motor(dist*step/1000+.9);var stopM=muzak();
 shaft.classList.add("shake");up.classList.toggle("on",dir>0);dn.classList.toggle("on",dir<0);
 for(var n=from;n!==to;){n+=dir;num.textContent=n;tick();seam.classList.add("pass");setTimeout(function(){seam.classList.remove("pass")},90);await wait(step)}
 stopM();shaft.classList.remove("shake");up.classList.remove("on");dn.classList.remove("on");cur=i;
 await wait(500);var t=ac.currentTime;bell(t);if(dir<0)bell(t+.6);buzz([40,60,40]);
 await wait(dir<0?1300:800);render(cur);doorSnd();shaft.classList.remove("closed");await wait(1000);busy=false}

FLOORS.forEach(function(f,i){var b=document.createElement("button");b.className="btn"+(f.hot?" hot":"");b.setAttribute("aria-label","Этаж "+f.n+": "+f.label);
 b.innerHTML="<i>"+f.n+"</i><span></span>";b.lastChild.textContent=f.label;b.onclick=function(){go(i)};panel.appendChild(b)});
var bl=document.createElement("button");bl.className="btn bell";bl.setAttribute("aria-label","Вызов диспетчера");bl.innerHTML="<i>🔔</i><span>Вызов</span>";bl.onclick=alarm;panel.appendChild(bl);
render(0);light(0);setTimeout(function(){shaft.classList.remove("closed")},500);
</script>
</body>
</html>
