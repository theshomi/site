<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24211f">
<title>the.shomi</title>
<style>
:root{color-scheme:dark;--bg:#24211f;--steel:#8d8a86;--steel-hi:#d3d0cb;--steel-lo:#55524f;--brass:#c8a35b;--led:#ff9d2e;--ink:#f3eee6;--muted:#b0a9a0;--red:#e0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Manrope","Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding:14px 16px 16px;gap:14px;background:linear-gradient(90deg,#1a1817,var(--bg) 8%,var(--bg) 92%,#1a1817)}
.board{display:flex;align-items:center;justify-content:center;gap:16px;background:#120f0d;border:2px solid var(--brass);border-radius:10px;padding:8px 18px;box-shadow:inset 0 0 18px #000,0 2px 0 #000}
.arrow{font-size:22px;color:var(--led);opacity:.15;transition:opacity .2s;width:20px;text-align:center}
.arrow.on{opacity:1;text-shadow:0 0 10px var(--led)}
.num{font:700 44px/1 "Courier New",monospace;color:var(--led);text-shadow:0 0 14px var(--led);min-width:60px;text-align:center}
.shaft{position:relative;flex:1;min-height:0;border:6px solid var(--steel-lo);border-radius:6px;background:#000;overflow:hidden;box-shadow:0 0 0 2px #000,inset 0 0 30px #000}
.shaft.shake{animation:sh .22s linear infinite}
@keyframes sh{0%,100%{transform:translate(0,0)}25%{transform:translate(1px,-1px)}75%{transform:translate(-1px,1px)}}
.room{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:24px;background:radial-gradient(circle at 50% 38%,var(--c,#6b4a2b) 0,#150f0d 78%)}
.room .ico{font-size:76px;line-height:1;filter:drop-shadow(0 6px 14px #0008)}
.room h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.01em}
.room p{margin:0;color:var(--muted);font-size:15px;max-width:27ch;line-height:1.4}
.go{margin-top:6px;display:inline-block;padding:14px 28px;border-radius:999px;background:var(--ink);color:#1b1512;font-weight:800;font-size:16px;text-decoration:none;box-shadow:0 6px 0 #0006}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 #0006}
.r13 .ico,.r13 h1{animation:fl 3s infinite}
.r13 h1{color:#ff6a5a}
@keyframes fl{0%,88%,100%{opacity:1}89%{opacity:.25}91%{opacity:1}94%{opacity:.5}96%{opacity:1}}
.door{position:absolute;top:0;bottom:0;width:50.4%;z-index:2;
background:linear-gradient(90deg,#fff3,transparent 22%,transparent 78%,#0005),repeating-linear-gradient(90deg,#ffffff0a 0 1px,transparent 1px 3px),linear-gradient(180deg,var(--steel-hi),var(--steel) 32%,var(--steel-lo));
transition:transform 1s cubic-bezier(.6,0,.3,1);box-shadow:inset 0 0 0 3px #0003}
.door.l{left:0;border-right:2px solid #000;transform:translateX(-101%)}
